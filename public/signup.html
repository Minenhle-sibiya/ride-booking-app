<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideBook - Create Account</title>
    <style>
        /* Copy the same styles from login.html */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2rem;
            color: #00d4aa;
            margin-bottom: 5px;
        }

        .logo p {
            color: #888;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4aa;
        }

        .form-group select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #00d4aa;
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: #00b894;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: #2a0a0a;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #0a2a1a;
            color: #00d4aa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin: 5px 0;
        }

        .role-option {
            flex: 1;
            padding: 12px;
            background: #0f0f1a;
            border: 2px solid #2a2a4a;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .role-option:hover {
            border-color: #444;
        }

        .role-option.selected {
            border-color: #00d4aa;
            background: #1a2a3e;
        }

        .role-option .icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
        }

        .form-footer a {
            color: #00d4aa;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #1a1a2e;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🚗 RideBook</h1>
            <p>Create your account</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Password (min 6 characters)</label>
                <input type="password" id="signupPassword" placeholder="Choose a password" minlength="6" required>
            </div>
            <div class="form-group">
                <label>Email (optional)</label>
                <input type="email" id="signupEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Phone (optional)</label>
                <input type="tel" id="signupPhone" placeholder="Phone number">
            </div>
            <div class="form-group">
                <label>I want to be a:</label>
                <div class="role-selector">
                    <div class="role-option selected" data-role="rider">
                        <span class="icon">🧑</span>
                        Rider
                    </div>
                    <div class="role-option" data-role="driver">
                        <span class="icon">🚗</span>
                        Driver
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="signupBtn">Create Account</button>
            <div class="form-footer">
                Already have an account? <a href="/">Sign in</a>
            </div>
        </form>
    </div>

    <script>
        // ============ DOM REFS ============
        const signupForm = document.getElementById('signupForm');
        const signupBtn = document.getElementById('signupBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        const signupName = document.getElementById('signupName');
        const signupUsername = document.getElementById('signupUsername');
        const signupPassword = document.getElementById('signupPassword');
        const signupEmail = document.getElementById('signupEmail');
        const signupPhone = document.getElementById('signupPhone');
        
        const roleOptions = document.querySelectorAll('.role-option');

        // ============ STATE ============
        let selectedRole = 'rider';

        // ============ ROLE SELECTION ============
        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                roleOptions.forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                selectedRole = this.dataset.role;
            });
        });

        // ============ MESSAGE FUNCTIONS ============
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }

        // ============ SET BUTTON LOADING ============
        function setLoading(button, loading) {
            if (loading) {
                button.disabled = true;
                button.innerHTML = '<span class="spinner"></span> Creating Account...';
            } else {
                button.disabled = false;
                button.textContent = 'Create Account';
            }
        }

        // ============ SIGNUP ============
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            setLoading(signupBtn, true);

            const name = signupName.value.trim();
            const username = signupUsername.value.trim();
            const password = signupPassword.value;
            const email = signupEmail.value.trim();
            const phone = signupPhone.value.trim();

            if (!name || !username || !password) {
                showError('Please fill in all required fields');
                setLoading(signupBtn, false);
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                setLoading(signupBtn, false);
                return;
            }

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        username,
                        password,
                        email,
                        phone,
                        role: selectedRole
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess(`✅ Account created! You can now sign in as a ${selectedRole}.`);
                    
                    // Clear form
                    signupForm.reset();
                    document.querySelector('[data-role="rider"]').classList.add('selected');
                    document.querySelector('[data-role="driver"]').classList.remove('selected');
                    selectedRole = 'rider';

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    showError(data.error || 'Signup failed. Please try again.');
                }
            } catch (error) {
                console.error('Signup error:', error);
                showError('Network error. Please check your connection.');
            } finally {
                setLoading(signupBtn, false);
            }
        });

        // Check if already logged in
        const userData = localStorage.getItem('ridebook_user');
        if (userData) {
            const user = JSON.parse(userData);
            if (user.role === 'driver') {
                window.location.href = '/driver';
            } else {
                window.location.href = '/rider';
            }
        }

        console.log('🚗 RideBook Signup Page Loaded!');
    </script>
</body>
</html>
