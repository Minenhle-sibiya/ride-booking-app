<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideBook - Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #FFD1DC, #FFF5E1);
      color: #1f2937;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      color: #d63384;
      font-size: 2rem;
    }

    p.lead {
      margin: 0 0 16px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #e2e8f0;
    }

    select,
    input {
      width: 100%;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e6e6e6;
      background: #fff;
      color: #1f2937;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: #ff8fab;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #ff6f92;
    }

    .message {
      margin-top: 12px;
      color: #de2b6d;
      min-height: 20px;
    }

    .small-link { margin-top: 12px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>RideBook</h1>
    <p class="lead">Create a new account to continue as a rider or driver.</p>

    <form id="signup-form">
      <label for="role">Select role</label>
      <select id="role" name="role">
        <option value="rider">Rider</option>
        <option value="driver">Driver</option>
      </select>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Choose a username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Choose a password" required />

      <button type="submit">Create account</button>
    </form>

    <p id="message" class="message"></p>
    <p class="small-link">Already have an account? <a href="/">Sign in</a></p>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const role = document.getElementById('role').value;
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const resp = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role })
        });
        const data = await resp.json();
        if (!resp.ok) {
          message.textContent = data.error || 'Signup failed';
          return;
        }
        // created -> redirect to login
        window.location.href = '/';
      } catch (err) {
        console.error(err);
        message.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
