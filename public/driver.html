<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Driver Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      overflow: auto; 
      background: #0f0f1a;
    }
    #driver-dashboard {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #1a1a2e;
      min-height: 100vh;
      color: #ffffff;
    }
    #driver-dashboard h1 {
      color: #00d4aa;
      margin-bottom: 5px;
    }
    #driver-dashboard p {
      color: #aaaaaa;
      margin-bottom: 20px;
    }
    .ride-card {
      background: #16213e;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 3px solid #ffc107;
    }
    .ride-card.accepted {
      border-left-color: #00d4aa;
    }
    .ride-card.in_progress {
      border-left-color: #3498db;
    }
    .ride-card.completed {
      border-left-color: #6c757d;
      opacity: 0.7;
    }
    .ride-card .coords {
      font-size: 0.95rem;
      color: #cccccc;
      margin-bottom: 10px;
    }
    .ride-card .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-badge.pending {
      background: #ffc107;
      color: #1a1a2e;
    }
    .status-badge.accepted {
      background: #00d4aa;
      color: #1a1a2e;
    }
    .status-badge.in_progress {
      background: #3498db;
      color: #fff;
    }
    .status-badge.completed {
      background: #6c757d;
      color: #fff;
    }
    .ride-card .ride-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: #888;
      margin-top: 6px;
    }
    .ride-card button { 
      margin-right: 8px; 
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .accept-btn {
      background: #00d4aa;
      color: #1a1a2e;
    }
    .accept-btn:hover {
      background: #00b894;
    }
    .complete-btn {
      background: #6c63ff;
      color: #ffffff;
    }
    .complete-btn:hover {
      background: #5a52d9;
    }
    .no-rides { 
      color: #666; 
      font-style: italic; 
      text-align: center;
      padding: 40px 0;
    }
    .ride-count {
      background: #16213e;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #aaa;
    }
    .ride-count span {
      color: #00d4aa;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="driver-dashboard">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div>
        <h1> Driver Dashboard</h1>
        <p>Manage incoming ride requests</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="rideCount" class="ride-count"> <span id="countNumber">0</span> active</span>
        <button onclick="logout()" style="background:#e74c3c;color:#fff;padding:8px 16px;border:none;border-radius:4px;cursor:pointer;">
          Logout
        </button>
      </div>
    </div>
    <div id="driver-rides"></div>
  </div>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="driver.js"></script>
  
  <script>
    // Check if user is logged in
    const userData = localStorage.getItem('ridebook_user');
    if (!userData) {
        window.location.href = '/';
    }
    
    const user = JSON.parse(userData);
    if (user.role !== 'driver') {
        window.location.href = '/rider';
    }
    
    console.log(' Logged in as:', user.username, '(Driver)');
    
    function logout() {
        localStorage.removeItem('ridebook_user');
        window.location.href = '/';
    }
  </script>
</body>
</html>
