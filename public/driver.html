<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Driver Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: auto; }
    #driver-dashboard {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #fff;
      min-height: 100vh;
      color: #1f2937;
      border-left: 1px solid rgba(0,0,0,0.04);
    }
    #driver-dashboard h1 {
      color: #d63384;
      margin-bottom: 5px;
    }
    #driver-dashboard p {
      color: #6b7280;
      margin-bottom: 20px;
    }
    .ride-card {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .ride-card .coords {
      font-size: 0.95rem;
      color: #374151;
      margin-bottom: 10px;
    }
    .ride-card button { margin-right: 8px; }
    .accept-btn {
      background: #ff8fab;
      color: #ffffff;
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .complete-btn {
      background: #6c63ff;
      color: #ffffff;
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .no-rides { color: #6b7280; font-style: italic; }
  </style>
</head>
<body>
  <div id="driver-dashboard">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <h1>Driver Dashboard</h1>
      <button id="logout-btn" class="logout-btn">Logout</button>
    </div>
    <p>Pending rides will appear below. Accept or complete them.</p>
    <div id="driver-rides"></div>
  </div>
  <script src="driver.js"></script>
</body>
</html>
