<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Book a Ride</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <!-- Header -->
      <div class="sidebar-header">
        <h1>RideBook</h1>
        <div class="user-info">
          <span id="userName" class="user-name">Guest</span>
          <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
      </div>

      <!-- Ride Type Selection -->
      <div class="ride-types">
        <button class="ride-type-btn active" data-type="economy">
          <span class="ride-type-name">Economy</span>
          <span class="ride-type-price">R15/km</span>
        </button>
        <button class="ride-type-btn" data-type="premium">
          <span class="ride-type-name">Premium</span>
          <span class="ride-type-price">R25/km</span>
        </button>
        <button class="ride-type-btn" data-type="suv">
          <span class="ride-type-name">SUV</span>
          <span class="ride-type-price">R30/km</span>
        </button>
        <button class="ride-type-btn" data-type="xl">
          <span class="ride-type-name">XL</span>
          <span class="ride-type-price">R35/km</span>
        </button>
      </div>

      <!-- Payment Method -->
      <div class="payment-method">
        <label>Payment Method:</label>
        <select id="paymentMethod">
          <option value="cash">Cash</option>
          <option value="card">Card</option>
          <option value="paypal">PayPal</option>
        </select>
      </div>

      <!-- Scheduled Ride -->
      <div class="schedule-section">
        <label>Schedule Ride:</label>
        <input type="datetime-local" id="scheduledTime">
        <span class="hint">Leave empty for immediate booking</span>
      </div>

      <!-- Favorite Locations -->
      <div class="favorites-section">
        <label>Saved Locations:</label>
        <select id="favoritesSelect">
          <option value="">Select a saved location...</option>
        </select>
        <div class="add-favorite">
          <input type="text" id="favoriteName" placeholder="Location name">
          <button id="saveFavoriteBtn" class="save-fav-btn">Save</button>
        </div>
      </div>

      <!-- Quick Cities - South Africa -->
      <div class="city-section">
        <label>Quick Cities:</label>
        <div class="city-buttons">
          <button class="city-btn" data-lat="-33.9608" data-lng="25.6022">Port Elizabeth</button>
          <button class="city-btn" data-lat="-33.9249" data-lng="18.4241">Cape Town</button>
          <button class="city-btn" data-lat="-26.2041" data-lng="28.0473">Johannesburg</button>
          <button class="city-btn" data-lat="-29.8587" data-lng="31.0218">Durban</button>
        </div>
      </div>

      <p class="instruction" id="instruction">Click the map to set your pickup location</p>

      <!-- Ride Details -->
      <div id="ride-details" class="hidden">
        <div class="detail-item">
          <span class="detail-label">Distance:</span>
          <span id="rideDistance">0</span> km
        </div>
        <div class="detail-item">
          <span class="detail-label">Duration:</span>
          <span id="rideDuration">0</span> min
        </div>
        <div class="detail-item">
          <span class="detail-label">Estimated Fare:</span>
          <span id="rideFare">R0.00</span>
        </div>
      </div>

      <div id="ride-controls" class="hidden">
        <button id="request-btn" class="btn-primary">Request Ride</button>
        <button id="reset-btn" class="btn-secondary">Reset</button>
      </div>

      <h2>Your Rides</h2>
      <ul id="rides-list"></ul>

      <!-- Ride History -->
      <h2 style="margin-top:20px;">Ride History</h2>
      <div class="history-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="cancelled">Cancelled</button>
      </div>
      <div id="history-list"></div>
    </div>
    <div id="map"></div>
  </div>

  <!-- Notification Container -->
  <div id="notification-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="app.js"></script>

  <script>
    // Check if user is logged in
    const userData = localStorage.getItem('ridebook_user');
    if (!userData) {
        window.location.href = '/';
    }
    
    const user = JSON.parse(userData);
    if (user.role !== 'rider') {
        window.location.href = '/driver';
    }
    
    console.log('Logged in as:', user.username, '(Rider)');
    
    // Set username display
    document.getElementById('userName').textContent = user.name || user.username;
    
    function logout() {
        localStorage.removeItem('ridebook_user');
        window.location.href = '/';
    }
  </script>
</body>
</html>
