<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideBook - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2rem;
            color: #00d4aa;
            margin-bottom: 5px;
        }

        .logo p {
            color: #888;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #16213e;
            border: 2px solid transparent;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active {
            border-color: #00d4aa;
            color: #00d4aa;
            background: #1a2a3e;
        }

        .tab-btn:hover {
            background: #1a2a3e;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4aa;
        }

        .form-group select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #00d4aa;
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: #00b894;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: #2a0a0a;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #0a2a1a;
            color: #00d4aa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin: 5px 0;
        }

        .role-option {
            flex: 1;
            padding: 12px;
            background: #0f0f1a;
            border: 2px solid #2a2a4a;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .role-option:hover {
            border-color: #444;
        }

        .role-option.selected {
            border-color: #00d4aa;
            background: #1a2a3e;
        }

        .role-option .icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
        }

        .form-footer a {
            color: #00d4aa;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #1a1a2e;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🚗 RideBook</h1>
            <p>Sign in as a rider or driver</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="login">Sign In</button>
            <button class="tab-btn" data-tab="signup">Create Account</button>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
            <div class="form-footer">
                Don't have an account? <a href="#" id="switchToSignup">Create one</a>
            </div>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" style="display: none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Password (min 6 characters)</label>
                <input type="password" id="signupPassword" placeholder="Choose a password" minlength="6" required>
            </div>
            <div class="form-group">
                <label>Email (optional)</label>
                <input type="email" id="signupEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Phone (optional)</label>
                <input type="tel" id="signupPhone" placeholder="Phone number">
            </div>
            <div class="form-group">
                <label>I want to be a:</label>
                <div class="role-selector">
                    <div class="role-option selected" data-role="rider">
                        <span class="icon">🧑</span>
                        Rider
                    </div>
                    <div class="role-option" data-role="driver">
                        <span class="icon">🚗</span>
                        Driver
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="signupBtn">Create Account</button>
            <div class="form-footer">
                Already have an account? <a href="#" id="switchToLogin">Sign in</a>
            </div>
        </form>
    </div>

    <script>
        // ============ DOM REFS ============
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const signupName = document.getElementById('signupName');
        const signupUsername = document.getElementById('signupUsername');
        const signupPassword = document.getElementById('signupPassword');
        const signupEmail = document.getElementById('signupEmail');
        const signupPhone = document.getElementById('signupPhone');
        
        const tabBtns = document.querySelectorAll('.tab-btn');
        const roleOptions = document.querySelectorAll('.role-option');
        const switchToSignup = document.getElementById('switchToSignup');
        const switchToLogin = document.getElementById('switchToLogin');

        // ============ STATE ============
        let selectedRole = 'rider';

        // ============ TAB SWITCHING ============
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const tab = this.dataset.tab;
                if (tab === 'login') {
                    loginForm.style.display = 'block';
                    signupForm.style.display = 'none';
                    hideMessages();
                } else {
                    loginForm.style.display = 'none';
                    signupForm.style.display = 'block';
                    hideMessages();
                }
            });
        });

        switchToSignup.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('[data-tab="signup"]').click();
        });

        switchToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('[data-tab="login"]').click();
        });

        // ============ ROLE SELECTION ============
        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                roleOptions.forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                selectedRole = this.dataset.role;
            });
        });

        // ============ MESSAGE FUNCTIONS ============
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }

        // ============ SET BUTTON LOADING ============
        function setLoading(button, loading) {
            if (loading) {
                button.disabled = true;
                button.innerHTML = '<span class="spinner"></span> Loading...';
            } else {
                button.disabled = false;
                button.textContent = button === loginBtn ? 'Sign In' : 'Create Account';
            }
        }

        // ============ LOGIN ============
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            setLoading(loginBtn, true);

            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();

            if (!username || !password) {
                showError('Please enter both username and password');
                setLoading(loginBtn, false);
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save user data
                    localStorage.setItem('ridebook_user', JSON.stringify({
                        id: data.id,
                        username: data.username,
                        role: data.role,
                        name: data.name
                    }));

                    showSuccess(`Welcome back, ${data.name || data.username}!`);

                    // Redirect based on role
                    setTimeout(() => {
                        if (data.role === 'driver') {
                            window.location.href = '/driver';
                        } else {
                            window.location.href = '/rider';
                        }
                    }, 1000);
                } else {
                    showError(data.error || 'Login failed. Please try again.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please check your connection.');
            } finally {
                setLoading(loginBtn, false);
            }
        });

        // ============ SIGNUP ============
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            setLoading(signupBtn, true);

            const name = signupName.value.trim();
            const username = signupUsername.value.trim();
            const password = signupPassword.value;
            const email = signupEmail.value.trim();
            const phone = signupPhone.value.trim();

            if (!name || !username || !password) {
                showError('Please fill in all required fields');
                setLoading(signupBtn, false);
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                setLoading(signupBtn, false);
                return;
            }

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        username,
                        password,
                        email,
                        phone,
                        role: selectedRole
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess(`Account created successfully! You can now sign in as a ${selectedRole}.`);
                    
                    // Clear form
                    signupForm.reset();
                    document.querySelector('[data-role="rider"]').classList.add('selected');
                    document.querySelector('[data-role="driver"]').classList.remove('selected');
                    selectedRole = 'rider';

                    // Switch to login after 2 seconds
                    setTimeout(() => {
                        document.querySelector('[data-tab="login"]').click();
                        // Pre-fill username
                        loginUsername.value = username;
                    }, 2000);
                } else {
                    showError(data.error || 'Signup failed. Please try again.');
                }
            } catch (error) {
                console.error('Signup error:', error);
                showError('Network error. Please check your connection.');
            } finally {
                setLoading(signupBtn, false);
            }
        });

        // ============ ENTER KEY SUPPORT ============
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (loginForm.style.display !== 'none') {
                    loginForm.dispatchEvent(new Event('submit'));
                } else {
                    signupForm.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============ CHECK IF ALREADY LOGGED IN ============
        const userData = localStorage.getItem('ridebook_user');
        if (userData) {
            const user = JSON.parse(userData);
            // Redirect to appropriate dashboard
            if (user.role === 'driver') {
                window.location.href = '/driver';
            } else {
                window.location.href = '/rider';
            }
        }

        console.log('🚗 RideBook Login Page Loaded!');
        console.log('📝 Create an account as Rider or Driver');
    </script>
</body>
</html>
