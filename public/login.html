<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideBook - Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 8px;
      color: #2dd4bf;
      font-size: 2rem;
    }

    p {
      margin: 0 0 16px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #e2e8f0;
    }

    select,
    input {
      width: 100%;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: #2dd4bf;
      color: #052e2b;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #5eead4;
    }

    .message {
      margin-top: 12px;
      color: #fda4af;
      min-height: 20px;
    }

    .demo-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(45, 212, 191, 0.1);
      border: 1px solid rgba(45, 212, 191, 0.25);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>RideBook</h1>
    <p>Sign in as a rider or a driver to continue.</p>

    <form id="login-form">
      <label for="role">Select role</label>
      <select id="role" name="role">
        <option value="rider">Rider</option>
        <option value="driver">Driver</option>
      </select>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Enter username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter password" required />

      <button type="submit">Sign In</button>
    </form>

    <p id="message" class="message"></p>

    <div class="demo-box">
      <strong>Demo credentials:</strong><br />
      Rider: rider / rider123<br />
      Driver: driver / driver123
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const role = document.getElementById('role').value;
      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();

      if (role === 'rider' && username === 'rider' && password === 'rider123') {
        localStorage.setItem('ridebook-role', 'rider');
        window.location.href = '/rider';
        return;
      }

      if (role === 'driver' && username === 'driver' && password === 'driver123') {
        localStorage.setItem('ridebook-role', 'driver');
        window.location.href = '/driver';
        return;
      }

      message.textContent = 'Invalid login. Please use the demo credentials shown below.';
    });
  </script>
</body>
</html>
